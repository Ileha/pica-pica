name: build

on:
  push:
    branches:
      - build/test
      - build/release
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBRTC_APM_VER: "1.3"

jobs:
  deb:
    # same in-container worker as deb_packaging/build-pica-packages.sh, incl. the noble webrtc backport
    name: .deb ${{ matrix.name }} (client + node)
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-13, image: "debian:trixie" }
          - { name: ubuntu-24.04, image: "ubuntu:24.04" }
          - { name: ubuntu-26.04, image: "ubuntu:26.04" }
          - { name: ubuntu-rolling, image: "ubuntu:rolling" }
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        run: |
          mkdir -p /src /out
          tar -C .. --exclude=.git -cf /src/pica-source.tar "$(basename "$PWD")"
          ln -sfn "$PWD/deb_packaging" /scripts
          PICA_DISTRO=$(. /etc/os-release && echo "$VERSION_CODENAME") bash deb_packaging/container-build.sh

      - name: Smoke test
        run: |
          cd /build/*/
          ./pica-node -V
          # the client should still be running when timeout kills it (exit 124)
          HOME=$(mktemp -d) QT_QPA_PLATFORM=offscreen timeout 5 pica-client/pica-client || [ $? -eq 124 ]

      - uses: actions/upload-artifact@v4
        with:
          name: pica-pica-${{ matrix.name }}-amd64
          path: /out/**/*.deb
          retention-days: 7

  linux-client:
    # build check only: distros without a .deb recipe, and the Qt 5 code path
    name: Client ${{ matrix.name }} (${{ matrix.qt }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-22.04, image: "ubuntu:22.04", qt: qt5 }
          - { name: ubuntu-24.04, image: "ubuntu:24.04", qt: qt5 }
          - { name: arch, image: "archlinux:latest", qt: qt6 }
          - { name: fedora, image: "fedora:latest", qt: qt6 }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash .github/install-deps.sh client-${{ matrix.qt }}

      - name: Build webrtc-audio-processing if the distro lacks 1.x/2.x
        run: |
          pkg-config --exists webrtc-audio-processing-1 || pkg-config --exists webrtc-audio-processing-2 \
            || bash .github/build-webrtc-audio-processing.sh /opt/webrtc

      - name: Build client and node
        run: |
          export PKG_CONFIG_PATH=/opt/webrtc/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
          autoreconf --install --force
          ./configure --with-qt=${{ matrix.qt }}
          make -j$(nproc)
          ./pica-node -V

  linux-node:
    name: Node ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-13, image: "debian:trixie" }
          - { name: ubuntu-22.04, image: "ubuntu:22.04" }
          - { name: ubuntu-24.04, image: "ubuntu:24.04" }
          - { name: ubuntu-26.04, image: "ubuntu:26.04" }
          - { name: ubuntu-rolling, image: "ubuntu:rolling" }
          - { name: arch, image: "archlinux:latest" }
          - { name: fedora, image: "fedora:latest" }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash .github/install-deps.sh node

      - name: Build node
        run: |
          autoreconf --install --force
          ./configure --disable-client
          make -j$(nproc)
          ./pica-node -V

      - uses: actions/upload-artifact@v4
        with:
          name: pica-node-${{ matrix.name }}-amd64
          path: |
            pica-node
            pica-node.conf
            nodelist.db
            dhparam4096.pem
          retention-days: 7

  windows:
    name: Windows x64 client (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            autoconf automake libtool make
          pacboy: >-
            toolchain:p pkgconf:p meson:p ninja:p cmake:p
            qt6-base:p ffmpeg:p openssl:p libevent:p sqlite3:p miniupnpc:p

      - name: Cache webrtc-audio-processing
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/msys64/opt/webrtc
          key: webrtc-apm-${{ env.WEBRTC_APM_VER }}-windows-ucrt64

      - name: Build webrtc-audio-processing
        run: .github/build-webrtc-audio-processing.sh /opt/webrtc

      - name: Build client
        run: |
          export PKG_CONFIG_PATH=/opt/webrtc/lib/pkgconfig:$PKG_CONFIG_PATH
          export PATH=/opt/webrtc/bin:/ucrt64/share/qt6/bin:$PATH
          autoreconf --install --force
          ./configure --with-qt=qt6 --disable-node --enable-d3d12va
          make -j$(nproc)

      - name: Bundle
        run: |
          export PATH=/opt/webrtc/bin:/ucrt64/share/qt6/bin:$PATH
          mkdir -p dist/share
          cp pica-client/pica-client.exe COPYING README windows/picapica.ico dist/
          cp dhparam4096.pem pica-client/picapica-icon-fly.png pica-client/picapica-icon-sit.png \
             pica-client/picapica-snd-newmessage.wav dist/share/
          windeployqt=$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt)
          "$windeployqt" --no-translations dist/pica-client.exe
          # non-Qt DLLs; repeated because each pass can pull in new dependencies
          for pass in 1 2 3; do
            find dist -name '*.dll' -o -name '*.exe' | xargs ldd \
              | awk '$3 ~ /^\/(ucrt64|opt)\// {print $3}' | sort -u \
              | xargs -r cp -n -t dist/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pica-client-windows-x64
          path: dist/
          retention-days: 7

  macos:
    name: macOS client (.dmg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install autoconf automake libtool pkgconf meson ninja qt ffmpeg openssl@3 libevent sqlite miniupnpc

      - name: Cache webrtc-audio-processing
        uses: actions/cache@v4
        with:
          path: ~/webrtc
          key: webrtc-apm-${{ env.WEBRTC_APM_VER }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build webrtc-audio-processing
        run: .github/build-webrtc-audio-processing.sh "$HOME/webrtc"

      - name: Build client
        run: |
          ssl=$(brew --prefix openssl@3); sqlite=$(brew --prefix sqlite)
          export PKG_CONFIG_PATH="$HOME/webrtc/lib/pkgconfig:$ssl/lib/pkgconfig:$sqlite/lib/pkgconfig"
          export CPPFLAGS="-I$ssl/include -I$sqlite/include" LDFLAGS="-L$ssl/lib -L$sqlite/lib -L$(brew --prefix)/lib"
          autoreconf --install --force
          ./configure --with-qt=qt6 --disable-node
          make -j$(sysctl -n hw.ncpu)

      - name: Bundle .dmg
        run: |
          # webrtc lives outside Homebrew; let macdeployqt find it
          export DYLD_LIBRARY_PATH=$HOME/webrtc/lib
          make deploy QTDIR=$(brew --prefix qt)/share/qt

      - uses: actions/upload-artifact@v4
        with:
          name: pica-client-macos-${{ runner.arch }}
          path: PicaPicaMessenger.dmg
          retention-days: 7
